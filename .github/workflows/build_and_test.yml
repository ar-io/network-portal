name: Staging deploy

on:
  push:
    branches:
      - develop

# Every push to develop force-pushes the built site to `gh-pages`. Without a
# concurrency group, two pushes in quick succession race that force-push: the
# loser fails with `cannot lock ref 'refs/heads/gh-pages'`, and if the loser is
# the NEWER commit, staging is left serving the older build with a green run to
# suggest otherwise. Merging a stack of PRs reproduces this reliably.
#
# One group for the whole branch, cancelling whatever is in flight, so the most
# recent commit always wins and older deploys stop rather than overwrite it.
concurrency:
  group: staging-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        step: ['lint:check', 'test', 'build']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - run: yarn install --frozen-lockfile
      - run: yarn ${{ matrix.step }}
        env:
          VITE_SOLANA_RPC_URL: ${{ secrets.VITE_SOLANA_RPC_URL }}
          VITE_SOLANA_MAINNET_RPC_URL: ${{ secrets.VITE_SOLANA_MAINNET_RPC_URL }}
          # The portal snapshot API. A public URL with no auth token, so it is a
          # var rather than a secret — visible in logs and auditable in the UI.
          # Deliberately NOT part of the verify-secrets gate: unset is a
          # supported state that falls back to direct RPC, and removing this
          # variable is the documented rollback.
          VITE_PORTAL_API_URL: ${{ vars.VITE_PORTAL_API_URL }}

  deploy-to-github:
    runs-on: ubuntu-latest
    needs: build
    environment: develop
    if: ${{ github.ref == 'refs/heads/develop' }}
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Install and Build 🔧
        run: |
          yarn install --frozen-lockfile
          yarn build
        env:
          # FOR BUILD
          VITE_NODE_ENV: develop
          VITE_GITHUB_HASH: ${{ github.sha }}
          VITE_ARIO_PROCESS_ID: ${{ vars.VITE_ARIO_PROCESS_ID }}
          # ao infra settings
          VITE_AO_CU_URL: ${{ vars.VITE_AO_CU_URL }}
          # Carry provider auth tokens — secrets (masked in logs), not vars.
          # Unset is tolerated on staging: the app falls back to the public,
          # rate-limited Solana RPC rather than failing the deploy.
          VITE_SOLANA_RPC_URL: ${{ secrets.VITE_SOLANA_RPC_URL }}
          VITE_SOLANA_MAINNET_RPC_URL: ${{ secrets.VITE_SOLANA_MAINNET_RPC_URL }}
          # The portal snapshot API. A public URL with no auth token, so it is a
          # var rather than a secret — visible in logs and auditable in the UI.
          # Deliberately NOT part of the verify-secrets gate: unset is a
          # supported state that falls back to direct RPC, and removing this
          # variable is the documented rollback.
          VITE_PORTAL_API_URL: ${{ vars.VITE_PORTAL_API_URL }}
      - name: Add CNAME Record
        run: |
          echo ${{ vars.DOMAIN_NAME }} > dist/CNAME
          cp ./404.html ./dist

      - name: Deploy 🚀
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          force_orphan: true
