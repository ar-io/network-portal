name: PR Preview Deployment

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - "content/**"
      - "src/**"

# Every push to an open PR publishes a preview to Arweave, permanently. Without
# this, pushing three times in quick succession stored three full bundles and
# only the last was ever looked at. Superseded runs are cancelled instead.
concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # On close the deploy is skipped, so building here only discards the result.
    if: github.event.action != 'closed'
    permissions:
      contents: read
    strategy:
      matrix:
        step: ["lint:check", "test", "build"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "yarn"
      - run: yarn install --frozen-lockfile
      # Deliberately no RPC secrets here. A pull request can change package.json
      # scripts or source, and none of lint/test/build needs a reachable
      # endpoint — the build only inlines whatever string it is given. The
      # validation build falls back to public RPC and is discarded.
      - run: yarn ${{ matrix.step }}

  deploy-preview:
    runs-on: ubuntu-latest
    needs: build
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.action != 'closed'
    permissions:
      contents: read
      # ar-io-deploy posts the preview URL back to the pull request.
      pull-requests: write
      # ar-io-deploy dedupes uploads through an Actions cache
      # (`ario-deploy-transaction-cache`), which it deletes and re-saves on every
      # run. Both steps are continue-on-error, so without this the cache fails to
      # save *silently* and every preview re-uploads files that never changed.
      actions: write

    steps:
      - name: Warn on missing RPC secrets
        env:
          # Presence checks only — values are never echoed.
          SOLANA_RPC_URL: ${{ secrets.VITE_SOLANA_RPC_URL }}
          SOLANA_MAINNET_RPC_URL: ${{ secrets.VITE_SOLANA_MAINNET_RPC_URL }}
        run: |
          if [[ -z "$SOLANA_RPC_URL" || -z "$SOLANA_MAINNET_RPC_URL" ]]; then
            echo "::warning::An RPC secret is empty — this preview falls back to the public, rate-limited Solana RPC and will not behave like staging or production."
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build application
        run: yarn build
        env:
          # Without these the preview builds against the public, rate-limited
          # Solana RPC and behaves differently from staging and production —
          # which reads as a bug in the PR rather than a gap in the workflow.
          VITE_SOLANA_RPC_URL: ${{ secrets.VITE_SOLANA_RPC_URL }}
          VITE_SOLANA_MAINNET_RPC_URL: ${{ secrets.VITE_SOLANA_MAINNET_RPC_URL }}

      - name: Deploy PR preview
        uses: ar-io/ar-io-deploy@v1
        with:
          deploy-key: ${{ secrets.DEPLOY_KEY }}
          arns-key: ${{ secrets.ARNS_KEY }}
          arns-name: ${{ secrets.ARNS_NAME }}
          preview: "true"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-folder: ./dist
          ttl-seconds: "60"
