name: Production Deploy

on:
  push:
    branches:
      - main

# Least privilege baseline: every job is read-only unless it says otherwise.
# Without this the jobs inherit the repository default, which is currently
# `write` — far more than any of them needs. `deploy-to-arweave` overrides this
# to add the one permission it genuinely requires. `deploy-to-firebase` passes
# `repoToken`, but the Firebase action uses that only to comment preview URLs on
# pull requests; a `channelId: live` deploy from a push has no PR to comment on.
permissions:
  contents: read

jobs:
  # The RPC URLs carry provider auth tokens, so they live in secrets rather than
  # in source. When unset the app falls back to the public Solana RPCs, which are
  # heavily rate-limited — and it fails *silently* at build time, so a missing
  # secret would ship a degraded production build that looks fine in CI. This
  # deploy is permanent (Arweave), so refuse rather than publish it.
  verify-secrets:
    runs-on: ubuntu-latest
    # Same environment as the deploy jobs so this resolves environment-scoped
    # secrets too, not just repo-level ones — otherwise adding the secret to the
    # `production` environment would still fail this gate.
    environment: production
    steps:
      - name: Require RPC secrets
        env:
          # Presence checks only — values are never echoed.
          SOLANA_RPC_URL: ${{ secrets.VITE_SOLANA_RPC_URL }}
          SOLANA_MAINNET_RPC_URL: ${{ secrets.VITE_SOLANA_MAINNET_RPC_URL }}
        run: |
          missing=0
          if [[ -z "$SOLANA_RPC_URL" ]]; then
            echo "::error::secrets.VITE_SOLANA_RPC_URL is empty — a production build would fall back to the public, rate-limited Solana RPC."
            missing=1
          fi
          if [[ -z "$SOLANA_MAINNET_RPC_URL" ]]; then
            echo "::error::secrets.VITE_SOLANA_MAINNET_RPC_URL is empty — the mainnet switcher would fall back to public api.mainnet-beta.solana.com."
            missing=1
          fi
          exit $missing

  build:
    runs-on: ubuntu-latest
    needs: verify-secrets
    environment: production
    strategy:
      matrix:
        step: ['lint:check', 'test', 'build']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
      - run: yarn install --frozen-lockfile
      - run: yarn ${{ matrix.step }}
        env:
          VITE_SOLANA_RPC_URL: ${{ secrets.VITE_SOLANA_RPC_URL }}
          VITE_SOLANA_MAINNET_RPC_URL: ${{ secrets.VITE_SOLANA_MAINNET_RPC_URL }}

  deploy-to-firebase:
    runs-on: ubuntu-latest
    needs: build
    environment: production
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Install and Build 🔧
        run: |
          yarn install --frozen-lockfile 
          yarn build
        env:
          # FOR BUILD
          VITE_NODE_ENV: production
          VITE_GITHUB_HASH: ${{ github.sha }}
          VITE_ARIO_PROCESS_ID: ${{ vars.VITE_ARIO_PROCESS_ID }}
          VITE_AO_CU_URL: ${{ vars.VITE_AO_CU_URL }}
          # Carry provider auth tokens — secrets (masked in logs), not vars.
          VITE_SOLANA_RPC_URL: ${{ secrets.VITE_SOLANA_RPC_URL }}
          VITE_SOLANA_MAINNET_RPC_URL: ${{ secrets.VITE_SOLANA_MAINNET_RPC_URL }}

      # Disribute to Firebase
      - name: Deploy 🚀
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_CI_SERVICE_ACCOUNT }}'
          channelId: live

  deploy-to-arweave:
    runs-on: ubuntu-latest
    needs: build
    environment: production
    permissions:
      contents: read
      # ar-io-deploy dedupes uploads through an Actions cache
      # (`ario-deploy-transaction-cache`), which it deletes and re-saves on every
      # run. Both steps are continue-on-error, so without this the cache fails to
      # save *silently* and every release re-uploads files that never changed —
      # permanently, to Arweave, at cost. This job currently works only because
      # the repository default token permission is `write`; declaring it here
      # means tightening that default cannot quietly start re-uploading the whole
      # bundle. The same permission was already lost and restored once on the
      # preview workflow (a85406d).
      actions: write
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Install and Build 🔧
        run: |
          yarn install --frozen-lockfile
          yarn build
        env:
          VITE_NODE_ENV: production
          VITE_GITHUB_HASH: ${{ github.sha }}
          VITE_ARIO_PROCESS_ID: ${{ vars.VITE_ARIO_PROCESS_ID }}
          VITE_AO_CU_URL: ${{ vars.VITE_AO_CU_URL }}
          # Carry provider auth tokens — secrets (masked in logs), not vars.
          VITE_SOLANA_RPC_URL: ${{ secrets.VITE_SOLANA_RPC_URL }}
          VITE_SOLANA_MAINNET_RPC_URL: ${{ secrets.VITE_SOLANA_MAINNET_RPC_URL }}

      - name: Deploy to Arweave
        uses: ar-io/ar-io-deploy@v1
        with:
          deploy-key: ${{ secrets.DEPLOY_KEY }}
          arns-key: ${{ secrets.ARNS_KEY }}
          # Production resolves the name from a repository *variable*; the
          # preview workflow uses a same-named *secret* so previews can target a
          # different name. Two sources, deliberately — change the right one.
          arns-name: ${{ vars.ARNS_NAME }}
          deploy-folder: ./dist
          # Without this the ArNS record inherits a 3600s TTL, so a release is
          # invisible for up to an hour after the workflow reports success. That
          # is how the 2.6.0 RPC fix deployed green at 22:23 while users kept
          # running the broken build — which was flooding a public RPC — until
          # the record expired. Five minutes still caches usefully but keeps a
          # hotfix reachable. Previews use 60s.
          ttl-seconds: "300"
